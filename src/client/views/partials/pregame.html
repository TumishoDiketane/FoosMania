<!-- manage game, view players, and start game -->
<style>
    /* =====================================================================
       Table Soccer — Pregame / Waiting room (FIFA Street theme)
       SPA partial: styles are inlined and scoped under .pregame-shell so
       nothing leaks into other views, and the shared shell + pregame.js are
       left untouched.

       Wall art reused from the login/lobby refresh (served from /images/):
         - /images/Refresh_Background_Portrait.webp   (portrait / phones)
         - /images/Refresh_Background_Landscape.webp   (landscape / desktop)

       Layout follows the OG waiting room: brand + Leave room top bar, a wide
       host / session-code panel, then Teams (Start game on the right) with the
       two team cards and the unassigned strip below. Spread on desktop,
    stacked on mobile. Team cards are tinted with the two kit colours of
    the planet currently selected for that team (kits.js), so the lobby
       matches the shirts on the pitch.
       ===================================================================== */

    .pregame-shell {
        --panel-hi: #c6e7f6;
        --panel-lo: #9fd3ed;
        --ink: #172044;
        --ink-dim: #35466e;
        --ink-mute: #586987;
        --accent: #2e9bf0;
        --accent-hi: #57b2ff;
        --accent-lo: #1a7bd2;
        --field-bg: #0f1318;
        --panel-border: rgba(23, 32, 68, 0.2);
        --line: rgba(23, 32, 68, 0.16);

        position: fixed;
        inset: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;

        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;

        background-color: #0b0d10;
        background-image:
            radial-gradient(125% 120% at 50% 22%, rgba(9, 12, 16, 0.30), rgba(5, 8, 12, 0.82) 92%),
            url("/images/Refresh_Background_Portrait.webp");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
    }

    .pregame-shell *,
    .pregame-shell *::before,
    .pregame-shell *::after {
        box-sizing: border-box;
    }

    .pregame-shell [hidden] {
        display: none !important;
    }

    .pregame-shell .pregame-inner {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        /* top-aligned, horizontally centered */
    }

    /* ---- Top bar: brand + Leave room ----------------------------------- */

    .pregame-shell .pregame-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 20px;
    }

    .pregame-shell .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
        /* let a long room name truncate/wrap */
    }

    .pregame-shell .brand-text {
        min-width: 0;
    }

    .pregame-shell .kicker {
        margin: 0 0 2px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #eaf6ff;
    }

    .pregame-shell .room-title {
        margin: 0;
        font-size: clamp(23px, 6vw, 30px);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #ffffff;
        word-break: break-word;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    /* ---- Buttons ------------------------------------------------------- */

    .pregame-shell .ghost-btn {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        border-radius: 9px;
        background: var(--button-secondary);
        border: 1px solid var(--button-secondary);
        transition: background 130ms ease, border-color 130ms ease, transform 90ms ease;
    }

    .pregame-shell .ghost-btn:hover {
        background: var(--button-secondary-hover);
        border-color: var(--button-secondary-hover);
        box-shadow: 0 0 0 3px rgba(101, 230, 226, 0.16);
    }

    .pregame-shell .ghost-btn:active {
        transform: translateY(1px);
    }

    .pregame-shell .ghost-btn:focus-visible {
        outline: 3px solid var(--button-selected);
        outline-offset: 2px;
    }

    .pregame-shell .start-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        cursor: pointer;
        padding: 13px 30px;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--button-secondary);
        border-radius: 10px;
        background: var(--button-primary);
        box-shadow:
            0 12px 24px -12px rgba(255, 128, 102, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.4),
            inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        transition: transform 90ms ease, background 130ms ease, color 130ms ease;
    }

    .pregame-shell .start-btn:hover {
        background: var(--button-primary-hover);
        box-shadow: 0 0 0 3px rgba(255, 128, 102, 0.18), 0 14px 32px rgba(255, 128, 102, 0.32);
    }

    .pregame-shell .start-btn:active {
        color: #fff;
        background: var(--button-primary-pressed);
        transform: translateY(1px);
    }

    .pregame-shell .start-btn:disabled {
        background: var(--button-disabled);
        color: #fff;
        cursor: default;
        box-shadow: none;
        filter: none;
        transform: none;
    }

    .pregame-shell .start-btn:focus-visible {
        outline: 3px solid var(--button-selected);
        outline-offset: 3px;
    }

    /* ---- Host / session panel ------------------------------------------ */

    .pregame-shell .host-panel {
        background: linear-gradient(165deg, rgba(198, 232, 247, 0.68), rgba(159, 211, 237, 0.66));
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 20px 22px;
        box-shadow: 0 24px 50px -26px rgba(0, 0, 0, 0.8);
    }

    .pregame-shell .host-top {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .pregame-shell .host-pill {
        align-self: flex-start;
        display: inline-block;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: rgba(139, 92, 246, 0.12);
        color: #49358c;
        border: 1px solid rgba(73, 53, 140, 0.35);
        margin-bottom: 10px;
    }

    .pregame-shell .session-line {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .pregame-shell .session-label {
        font-size: 13px;
        color: var(--ink-dim);
    }

    .pregame-shell .code-badge {
        font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
        letter-spacing: 0.14em;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        background: var(--field-bg);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 6px 12px;
    }

    .pregame-shell .copy-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .pregame-shell .share-room-btn {
        display: inline-grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
    }

    .pregame-shell .share-room-btn svg {
        width: 18px;
        height: 18px;
    }

    .pregame-shell .copy-state {
        font-size: 12px;
        color: #174e78;
        min-height: 1em;
    }

    .pregame-shell .room-status {
        margin: 16px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-dim);
    }

    /* ---- Teams heading + Start game ------------------------------------ */

    .pregame-shell .teams-head {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin: 26px 0 16px;
    }

    .pregame-shell .teams-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #ffffff;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

     /* ---- Team cards ------------------------------------------------------
         Tinted with the selected planet's two kit colours: pregame.js sets
       --team-grad / --team-soft / --team-border / --team-text per card from
       kits.js. The vars below are only the pre-kit / spectator fallback. --- */

    .pregame-shell .roster-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .pregame-shell .team-card[data-team="1"] {
        --team: #e74c3c;
        --team-soft: rgba(231, 76, 60, 0.16);
        --team-border: rgba(231, 76, 60, 0.42);
        --team-text: #f2a69c;
    }

    .pregame-shell .team-card[data-team="2"] {
        --team: #2e9bf0;
        --team-soft: rgba(46, 155, 240, 0.16);
        --team-border: rgba(46, 155, 240, 0.42);
        --team-text: #8fd0ff;
    }

    .pregame-shell .team-card.spectator-card {
        --team: #7f8c8d;
        --team-soft: rgba(127, 140, 141, 0.16);
        --team-border: rgba(127, 140, 141, 0.42);
        --team-text: #bdc3c7;
    }

    .pregame-shell .team-card {
        position: relative;
        overflow: hidden;
        background: linear-gradient(165deg, rgba(198, 232, 247, 0.68), rgba(159, 211, 237, 0.66));
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 18px 16px;
        display: flex;
        flex-direction: column;
        gap: 13px;
    }

    /* top strip in the kit's two colours (border-top can't hold a gradient) */
    .pregame-shell .team-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--team-grad, var(--team));
    }

    .pregame-shell .team-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .pregame-shell .team-name {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        color: var(--ink);
    }

    .pregame-shell .team-count {
        flex: 0 0 auto;
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--team-soft);
        color: var(--ink);
        border: 1px solid var(--team-border);
    }

    .pregame-shell .player-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .pregame-shell .player-row {
        background: rgba(23, 32, 68, 0.06);
        border: 1px solid rgba(23, 32, 68, 0.12);
        border-radius: 8px;
        padding: 8px 12px;
    }

    .pregame-shell .player-row strong {
        font-size: 14px;
        font-weight: 600;
        color: var(--ink);
    }

    .pregame-shell .small-note {
        margin: 0;
        font-size: 13px;
        color: var(--ink-mute);
    }

    .pregame-shell .team-join {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 11px 16px;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #ffffff;
        border-radius: 9px;
        background: var(--button-secondary);
        border: 1px solid var(--button-secondary);
        transition: background 130ms ease, border-color 130ms ease, transform 90ms ease;
    }

    .pregame-shell .team-join:hover {
        background: var(--button-secondary-hover);
        border-color: var(--button-secondary-hover);
        box-shadow: 0 0 0 3px rgba(101, 230, 226, 0.16);
    }

    .pregame-shell .team-join:active {
        transform: translateY(1px);
    }

    .pregame-shell .team-join:focus-visible {
        outline: 3px solid var(--button-selected);
        outline-offset: 2px;
    }

    /* On your current team: a filled, team-tinted "selected" state */
    .pregame-shell .team-join:disabled {
        cursor: default;
        transform: none;
        background: var(--button-selected);
        border-color: var(--button-selected);
        color: var(--button-secondary);
        box-shadow: 0 0 0 2px rgba(101, 230, 226, 0.14);
    }

    /* ---- Unassigned strip ---------------------------------------------- */

    .pregame-shell .unassigned-card {
        background: linear-gradient(165deg, rgba(198, 232, 247, 0.68), rgba(159, 211, 237, 0.66));
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 18px 20px;
        margin-top: 14px;
    }

    .pregame-shell .section-copy {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-dim);
    }

    /* ===================================================================
       Landscape / desktop — OG waiting-room spread
       =================================================================== */

    @media (orientation: landscape) {
        .pregame-shell {
            padding: 40px 28px;
            background-image:
                radial-gradient(120% 130% at 50% 25%, rgba(9, 12, 16, 0.28), rgba(5, 8, 12, 0.80) 92%),
                url("/images/Refresh_Background_Landscape.webp");
        }

        .pregame-shell .pregame-inner {
            max-width: 1000px;
        }

        .pregame-shell .pregame-head {
            margin-bottom: 24px;
        }

        .pregame-shell .host-top {
            flex-direction: row;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .pregame-shell .copy-wrap {
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .pregame-shell .teams-head {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .pregame-shell .roster-grid {
            grid-template-columns: 1fr 1fr 1fr;
        }
    }

    /* ---- Respect reduced-motion ---------------------------------------- */

    @media (prefers-reduced-motion: reduce) {

        .pregame-shell .ghost-btn,
        .pregame-shell .start-btn,
        .pregame-shell .team-join {
            transition: none;
        }

        .pregame-shell .ghost-btn:active,
        .pregame-shell .start-btn:active,
        .pregame-shell .team-join:active {
            transform: none;
        }
    }
    /* ---- QR code: centered, on a white quiet-zone card ------------------ */

    .pregame-shell #qrcode {
        display: flex;
        justify-content: center;
        margin: 16px auto 0;
        width: fit-content;
        padding: 10px;
        border-radius: 10px;
        background: #fff;
    }

    .pregame-shell #qrcode:empty {
        display: none;
    }

    /* ---- Match settings -------------------------------------------------- */

    .pregame-shell .settings-card {
        margin-top: 0;
        margin-bottom: 20px;
    }

    .pregame-shell .settings-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .pregame-shell .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: rgba(23, 32, 68, 0.06);
        border: 1px solid rgba(23, 32, 68, 0.12);
        border-radius: 8px;
        padding: 8px 12px;
    }

    .pregame-shell .setting-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
    }

    .pregame-shell .setting-row select {
        font: inherit;
        font-size: 14px;
        color: #ffffff;
        caret-color: #ffffff;
        background: var(--field-bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 6px 10px;
        max-width: 150px;
    }

    /* By default (host view) hide the read-only duration display */
    .pregame-shell .setting-value {
        display: none;
    }

    /* Non-host: show display elements, hide editable inputs */
    .pregame-shell .settings-card[data-readonly="true"] .host-only {
        display: none;
    }

    .pregame-shell .settings-card[data-readonly="true"] .setting-value {
        display: inline-flex;
    }

    /* Read-only setting value chip shown to non-host players */
    .pregame-shell .setting-value {
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        background: rgba(46, 155, 240, 0.12);
        border: 1px solid rgba(46, 155, 240, 0.35);
        color: #174e78;
        white-space: nowrap;
    }

    /* ---- Planet picker + host roster controls --------------------------- */

    .pregame-shell .country-select {
        font: inherit;
        font-size: 13px;
        color: #ffffff;
        caret-color: #ffffff;
        background: var(--field-bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 6px 10px;
    }

    .pregame-shell .player-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .pregame-shell .row-actions {
        display: inline-flex;
        gap: 6px;
    }

    .pregame-shell .row-btn {
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: var(--button-secondary);
        border: 1px solid var(--button-secondary);
        border-radius: 6px;
        padding: 4px 8px;
    }

    .pregame-shell .row-btn:hover {
        background: var(--button-secondary-hover);
        border-color: var(--button-secondary-hover);
        box-shadow: 0 0 0 2px rgba(101, 230, 226, 0.14);
    }

    .pregame-shell .row-btn.kick {
        color: #fff;
        background: var(--button-danger);
        border-color: var(--button-danger);
    }

    .pregame-shell .row-btn.kick:hover {
        filter: brightness(1.06);
    }

    .pregame-shell .row-btn:focus-visible {
        outline: 2px solid var(--button-selected);
        outline-offset: 2px;
    }

    @media (orientation: landscape) {
        .pregame-shell .settings-grid {
            grid-template-columns: 1fr 1fr;
        }
    }
</style>

<div class="pregame-shell">
    <div class="pregame-inner">
        <header class="pregame-head">
            <div class="brand">
                <div class="brand-text">
                    <p class="kicker">Game Lobby</p>
                    <h1 id="room-name" class="room-title">Loading...</h1>
                </div>
            </div>
            <button id="leave-room-button" class="ghost-btn">Leave room</button>
        </header>

        <section class="host-panel">
            <div class="host-top" id="session-code-container">
                <div class="host-meta">
                    <span id="host-pill" class="host-pill" hidden>You are host</span>
                    <div class="session-line">
                        <span class="session-label">Session code</span>
                        <span id="room-code" class="code-badge">------</span>
                    </div>
                </div>
                <div class="copy-wrap">
                    <button id="copy-code" class="ghost-btn" type="button">Copy code</button>
                    <button id="share-room" class="ghost-btn share-room-btn" type="button" aria-label="Share room" title="Share room">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"></path>
                        </svg>
                    </button>
                    <span id="copy-state" class="copy-state" aria-live="polite"></span>
                </div>
            </div>
            <div id="qrcode"></div>
            <p id="room-status" class="room-status" aria-live="polite">Players are split into two teams. Pick a side
                when you're ready.</p>
        </section>

        <section id="settings-panel" class="unassigned-card settings-card">
            <p class="section-copy">Match settings <span id="settings-lock" class="small-note"></span></p>
            <div class="settings-grid">
                <label class="setting-row">
                    <span class="setting-label">Time limit</span>
                    <select id="setting-duration" class="host-only">
                        <option value="">No limit</option>
                        <option value="60">1 minute</option>
                        <option value="120">2 minutes</option>
                        <option value="180">3 minutes</option>
                        <option value="300">5 minutes</option>
                        <option value="600">10 minutes</option>
                    </select>
                    <span id="setting-duration-display" class="setting-value">No limit</span>
                </label>
                <label class="setting-row">
                    <span class="setting-label">Substitution approval</span>
                    <select id="setting-substitution-approval" class="host-only">
                        <option value="player">Player approval</option>
                        <option value="host">Host approval</option>
                    </select>
                    <span id="setting-substitution-approval-display" class="setting-value">Player approval</span>
                </label>
                <label class="setting-row">
                    <span class="setting-label">Substitutions per team</span>
                    <select id="setting-substitutions-per-team" class="host-only">
                        <option value="0">None</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                    <span id="setting-substitutions-per-team-display" class="setting-value">3</span>
                </label>
            </div>
        </section>

        <div class="teams-head">
            <h2 class="teams-title">Teams</h2>
            <button id="start-game-button" class="start-btn" type="button" hidden>Start game</button>
        </div>

        <div class="roster-grid">
            <article class="team-card" data-team="1">
                <div class="team-header">
                    <h3 id="team1-name" class="team-name">Loading...</h3>
                    <span id="team1-count" class="team-count">0 players</span>
                </div>
                <select id="team1-country" class="country-select" hidden></select>
                <div id="team1-players" class="player-list"></div>
                <button id="team1-join" class="team-join" type="button">Join this team</button>
            </article>

            <article class="team-card" data-team="2">
                <div class="team-header">
                    <h3 id="team2-name" class="team-name">Loading...</h3>
                    <span id="team2-count" class="team-count">0 players</span>
                </div>
                <select id="team2-country" class="country-select" hidden></select>
                <div id="team2-players" class="player-list"></div>
