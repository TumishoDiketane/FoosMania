<style>
    /* SPA partial: styles scoped under .pitch-shell so nothing leaks into
       other views. */

    .pitch-shell {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        box-sizing: border-box;

        font-family: sans-serif;
        background: #222;
        color: #fff;
        text-align: center;
    }

    .pitch-shell *,
    .pitch-shell *::before,
    .pitch-shell *::after {
        box-sizing: border-box;
    }

    .pitch-shell [hidden] {
        display: none !important;
    }

    .pitch-shell #scoreline {
        font-size: 1.5rem;
        padding: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .pitch-shell .team-score {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
    }

    .pitch-shell .team-flag {
        display: inline-block;
        width: 24px;
        height: 16px;
        flex: 0 0 24px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 2px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
    }

    .pitch-shell #match-clock {
        font-size: 1.1rem;
        font-variant-numeric: tabular-nums;
        color: #ff0;
    }

    .pitch-shell #enable-motion {
        font-size: 1.1rem;
        background: #048BA8;
        color: #fff;
        border: 1px solid #048BA8;
        border-radius: 6px;
        padding: 10px 20px;
        margin-bottom: 10px;
        cursor: pointer;
    }

    .pitch-shell #enable-motion:hover {
        background: #037994;
    }

    .pitch-shell #enable-motion:focus-visible {
        outline: 3px solid #65e6e2;
        outline-offset: 3px;
    }

    .pitch-shell #pitch-container {
        display: inline-flex;
        justify-content: center;
        position: relative;
        width: 100%;
    }

    .pitch-shell #pitch {
        display: block;
        max-width: 95vw;
        max-height: 80vh;
        width: auto;
        height: auto;
        touch-action: none;
        position: relative;
        z-index: 1;
    }

    .pitch-shell #flick {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2.5rem;
        font-weight: bold;
        color: #ff0;
        pointer-events: none;
        z-index: 3;
    }

    .pitch-shell #gauge {
        position: relative;
        width: 60%;
        max-width: 400px;
        height: 20px;
        margin: 12px auto;
        background: #444;
        border: 1px solid #fff;
        overflow: hidden;
    }

    .pitch-shell #gauge-fill {
        width: 0%;
        height: 100%;
        background: #ff0;
        transition: width 50ms linear;
    }

    .pitch-shell #gauge-value {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        color: #fff;
        font: 700 11px/1 sans-serif;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
    }

    .pitch-shell #hint {
        padding: 8px;
        font-size: 0.9rem;
        color: #aaa;
    }

    /* ---- CSS stadium surround: landscape (desktop + spectators) ---------- */

    @media (orientation: landscape) {
        .pitch-shell #pitch-container.in-stadium {
            width: min(98vw, calc((100dvh - 150px) * 1.6));
            height: min(calc(98vw / 1.6), calc(100dvh - 150px));
            margin: 0 auto;
            overflow: hidden;
            border: clamp(8px, 1.5vw, 20px) solid #43545a;
            border-radius: clamp(18px, 3vw, 38px);
            background:
                radial-gradient(ellipse at 50% 50%, rgba(73, 132, 99, 0.4), transparent 62%),
                repeating-radial-gradient(circle at 5px 5px, #e7aa4a 0 1px, transparent 1.7px 8px),
                repeating-radial-gradient(circle at 3px 4px, #43a6ba 0 1px, transparent 1.6px 9px),
                linear-gradient(145deg, #263b48, #14252d 55%, #32434a);
            background-size: auto, 10px 10px, 12px 12px, auto;
            box-shadow:
                inset 0 0 0 4px rgba(224, 235, 228, 0.34),
                inset 0 0 28px rgba(0, 0, 0, 0.72),
                0 18px 44px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pitch-shell #pitch {
            width: 92%;
            max-width: none;
            max-height: 94%;
            height: auto;
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.42);
        }
    }

    /* ---- Goal overlay --------------------------------------------------- */

    .pitch-shell #goal-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 10;
        opacity: 0;
        transition: opacity 0.2s ease;
    }

    .pitch-shell #goal-overlay.visible {
        opacity: 1;
    }

    .pitch-shell #goal-overlay .goal-text {
        font-size: clamp(3rem, 10vw, 7rem);
        font-weight: 900;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        text-shadow:
            0 0 30px rgba(255, 220, 0, 0.9),
            0 0 60px rgba(255, 200, 0, 0.6),
            3px 3px 0 rgba(0,0,0,0.5);
        animation: goal-pulse 0.4s ease-in-out infinite alternate;
    }

    @keyframes goal-pulse {
        from { transform: scale(1); }
        to { transform: scale(1.06); }
    }

    /* ---- Kickoff / goal countdown ---------------------------------------- */

    .pitch-shell #countdown {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 11;
    }

    .pitch-shell #countdown span {
        font-size: clamp(90px, 32vmin, 240px);
        font-weight: 800;
        color: #fff;
        text-shadow: 0 0 24px rgba(0, 0, 0, 0.8), 0 4px 10px rgba(0, 0, 0, 0.6);
        animation: countdown-zoom 1s ease-out forwards;
    }

    @keyframes countdown-zoom {
        0% {
            transform: scale(0.3);
            opacity: 0;
        }

        25% {
            transform: scale(1);
            opacity: 1;
        }

        100% {
            transform: scale(2.4);
            opacity: 0;
        }
    }

    /* ---- Powerup pickup toast -------------------------------------------- */

    .pitch-shell #powerup-toast {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(12px);
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.75);
        border: 2px solid var(--powerup-color, #ffe14d);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        white-space: nowrap;
        pointer-events: none;
        z-index: 6;
        opacity: 0;
        transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .pitch-shell #powerup-toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    .pitch-shell #substitution-panel {
        width: min(560px, calc(100vw - 24px));
        margin: 8px auto;
        padding: 10px 12px;
        color: #fff;
        background: rgba(18, 25, 24, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 6px;
        text-align: left;
        position: relative;
        z-index: 12;
    }

    .pitch-shell .substitution-form,
    .pitch-shell .substitution-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }

    .pitch-shell .substitution-form select {
        min-width: 160px;
        max-width: 100%;
        padding: 7px 9px;
        color: #fff;
        background: #263b36;
        border: 1px solid #80928b;
        border-radius: 4px;
    }

    .pitch-shell .substitution-button {
        padding: 7px 10px;
        color: #fff;
        background: #048BA8;
        border: 1px solid #048BA8;
        border-radius: 4px;
        cursor: pointer;
    }

    .pitch-shell .substitution-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .pitch-shell .substitution-request {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 8px;
        margin-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
    }

    .pitch-shell #substitution-message {
        min-height: 1.2em;
        margin: 6px 0 0;
        color: #d6e3db;
        font-size: 0.9rem;
    }

    .pitch-shell #prediction-panel {
        width: min(560px, calc(100vw - 24px));
        margin: 8px auto;
        padding: 10px 12px;
        color: #fff;
        background: rgba(18, 25, 24, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 6px;
        text-align: left;
        position: relative;
        z-index: 12;
    }

    .pitch-shell #prediction-panel h2 {
        margin: 0 0 4px;
        font-size: 1rem;
    }

    .pitch-shell #prediction-panel p {
        margin: 5px 0;
    }

    .pitch-shell .prediction-form {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }

    .pitch-shell .prediction-form select {
        min-width: 180px;
        max-width: 100%;
        padding: 7px 9px;
        color: #fff;
        background: #263b36;
        border: 1px solid #80928b;
        border-radius: 4px;
    }

    .pitch-shell .prediction-button {
        padding: 7px 10px;
        color: #fff;
        background: #048BA8;
        border: 1px solid #048BA8;
        border-radius: 4px;
        cursor: pointer;
    }

    .pitch-shell .prediction-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .pitch-shell #prediction-message {
        min-height: 1.2em;
        margin: 6px 0 0;
        color: #d6e3db;
        font-size: 0.9rem;
    }

    .pitch-shell #prediction-history {
        margin: 6px 0 0;
        padding-left: 20px;
        font-size: 0.85rem;
    }

    .pitch-shell #shootout-panel {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: clamp(14px, 2.5vh, 26px);
        max-height: 100dvh;
        overflow: auto;
        margin: 0;
        padding: clamp(16px, 3vw, 42px);
        color: #eef8ff;
        background:
            radial-gradient(circle at 50% 15%, rgba(101, 230, 226, 0.18), transparent 22%),
            radial-gradient(circle at 15% 80%, rgba(255, 128, 102, 0.12), transparent 26%),
            linear-gradient(180deg, #050b1a 0%, #0d172b 30%, #09171c 100%);
        border: 0;
        border-radius: 0;
        text-align: left;
        box-shadow: inset 0 0 120px rgba(48, 73, 120, 0.38);
    }

    .pitch-shell.shootout-active {
        overflow: hidden;
        text-align: left;
        background: #06131c;
    }

    .pitch-shell.shootout-active > #scoreline,
    .pitch-shell.shootout-active > #substitution-panel,
    .pitch-shell.shootout-active > #enable-motion,
    .pitch-shell.shootout-active > #pitch-container,
    .pitch-shell.shootout-active > #prediction-panel,
    .pitch-shell.shootout-active > #gauge,
    .pitch-shell.shootout-active > #hint,
    .pitch-shell.shootout-active > #confetti {
        display: none !important;
    }

    .pitch-shell #shootout-panel [hidden] {
        display: none !important;
    }

    .pitch-shell .shootout-header,
    .pitch-shell .shootout-header-copy,
    .pitch-shell .shootout-scoreboard,
    .pitch-shell .shootout-matchup,
    .pitch-shell .duel-person,
    .pitch-shell .duel-person-copy,
    .pitch-shell .duel-gate-heading,
    .pitch-shell .shootout-controls,
    .pitch-shell .shootout-row,
    .pitch-shell #shootout-directions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }

    .pitch-shell .shootout-header {
        justify-content: space-between;
        align-items: flex-start;
    }

    .pitch-shell .shootout-header-copy {
        display: block;
    }

    .pitch-shell .shootout-eyebrow,
    .pitch-shell .shootout-score-label,
    .pitch-shell .duel-side-label {
        margin: 0;
        color: #8cdbd7;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }

    .pitch-shell #shootout-heading {
        margin: 6px 0 0;
        color: #f9f4d5;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.7rem, 3vw, 2.8rem);
        font-weight: 700;
        line-height: 1.05;
        text-shadow: 0 0 26px rgba(101, 230, 226, 0.22);
    }

    .pitch-shell .shootout-scoreboard {
        gap: 0;
        border: 1px solid rgba(118, 196, 214, 0.28);
        background: linear-gradient(180deg, rgba(12, 20, 33, 0.93), rgba(8, 16, 21, 0.84));
        box-shadow: inset 0 0 25px rgba(101, 230, 226, 0.08);
    }

    .pitch-shell .shootout-score {
        min-width: 140px;
        padding: 10px 16px;
    }

    .pitch-shell .shootout-score + .shootout-score {
        border-left: 1px solid rgba(118, 196, 214, 0.28);
    }

    .pitch-shell .shootout-score strong {
        display: block;
        margin-top: 4px;
        color: #fef5d0;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
        font-variant-numeric: tabular-nums;
    }

    .pitch-shell .shootout-matchup {
        justify-content: center;
        gap: 12px;
        padding: 8px 16px;
        border-top: 1px solid rgba(140, 219, 215, 0.2);
        border-bottom: 1px solid rgba(140, 219, 215, 0.2);
        color: #eaf7f9;
        font-size: 0.86rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        text-align: center;
    }

    .pitch-shell #shootout-status {
        margin: 0;
        color: #ffcf6d;
        font-size: 1.05rem;
        font-weight: 800;
        text-align: center;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(255, 192, 87, 0.28);
    }

    .pitch-shell .duel-stage {
        position: relative;
        display: grid;
        grid-template-columns: minmax(120px, 0.7fr) minmax(280px, 1.8fr);
        grid-template-areas: "kicker gate";
        align-items: center;
        width: min(1200px, 100%);
        min-height: clamp(260px, 42vh, 420px);
        margin: 0 auto;
        padding: 8px 2.25%;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(14, 26, 35, 0.45), rgba(12, 17, 21, 0.18));
        box-shadow: inset 0 0 50px rgba(101, 230, 226, 0.06);
    }

    .pitch-shell .duel-stage.is-away {
        grid-template-areas: "gate kicker";
    }

    .pitch-shell .duel-stage.is-away .duel-lanes {
        direction: rtl;
    }

    .pitch-shell .duel-stage.is-away .duel-lane {
        direction: ltr;
    }

    .pitch-shell .duel-person {
        position: relative;
        z-index: 2;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        min-width: 0;
        padding: 14px 10px;
        text-align: center;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(17, 25, 32, 0.18), rgba(17, 25, 32, 0.04));
        transition: transform 200ms ease, box-shadow 200ms ease;
    }

    .pitch-shell .duel-person:before {
        content: "";
        position: absolute;
        inset: 8px 0 auto;
        height: 75%;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.08), transparent 58%);
        pointer-events: none;
    }

    .pitch-shell #duel-kicker {
        grid-area: kicker;
    }

    .pitch-shell .duel-person-copy {
        position: relative;
        z-index: 1;
        flex-direction: column;
        gap: 2px;
        max-width: 100%;
    }

    .pitch-shell .duel-person-name {
        max-width: 100%;
        overflow-wrap: anywhere;
        color: #f2efe2;
        font-size: clamp(0.9rem, 1.7vw, 1.2rem);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .pitch-shell .duel-person-team {
        color: #a7d6d0;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .pitch-shell .duel-avatar {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: clamp(60px, 8vw, 94px);
        aspect-ratio: 1;
        border: 4px solid var(--duel-accent, #75dbc1);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.02) 22%, transparent 30%), linear-gradient(145deg, var(--duel-base, #31785f), #0d1c1d 56%, rgba(7, 16, 18, 0.95));
        box-shadow: 0 0 0 8px rgba(101, 230, 226, 0.08), 0 0 32px rgba(101, 230, 226, 0.15), 0 10px 30px rgba(0, 0, 0, 0.45);
        color: #fff;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.25rem, 2.8vw, 2.1rem);
        font-weight: 700;
        transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms ease;
    }

    .pitch-shell .duel-avatar::before,
    .pitch-shell .duel-avatar::after {
        content: "";
        position: absolute;
        inset: -12%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        pointer-events: none;
    }

    .pitch-shell .duel-avatar::after {
        inset: -18%;
        border-color: rgba(255, 255, 255, 0.12);
        animation: orbit 11s linear infinite;
    }

    @keyframes orbit {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.03); }
        100% { transform: rotate(360deg) scale(1); }
    }

    .pitch-shell .duel-gate {
        position: relative;
        grid-area: gate;
        min-width: 0;
        padding: 18px 16px 18px;
        border: 2px solid rgba(117, 236, 215, 0.78);
        border-radius: clamp(20px, 4vw, 34px);
        background: linear-gradient(180deg, rgba(18, 57, 62, 0.75), rgba(8, 18, 22, 0.94));
        box-shadow: inset 0 0 42px rgba(101, 230, 226, 0.12), 0 0 40px rgba(101, 230, 226, 0.18);
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 240ms ease;
    }

    .pitch-shell .duel-gate::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(118, 196, 214, 0.2);
        background: linear-gradient(90deg, rgba(101, 230, 226, 0.06) 0%, rgba(255, 128, 102, 0.02) 50%, rgba(255, 208, 102, 0.05) 100%);
        border-radius: inherit;
        pointer-events: none;
    }

    .pitch-shell .duel-gate-heading {
        position: relative;
        z-index: 1;
        justify-content: space-between;
        margin: 0 4px 12px;
    }

    .pitch-shell .duel-gate-title {
        color: #aef9ee;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
    }

    .pitch-shell .duel-gate-keeper {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #deeff0;
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .pitch-shell .duel-gate-keeper .duel-avatar {
        width: 34px;
        border-width: 2px;
        font-family: sans-serif;
        font-size: 0.72rem;
    }

    .pitch-shell .duel-lanes {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        min-height: clamp(134px, 24vh, 210px);
        border: 1px solid rgba(151, 225, 212, 0.44);
        background:
            linear-gradient(180deg, rgba(4, 19, 21, 0.55), rgba(7, 16, 20, 0.88)),
            repeating-linear-gradient(90deg, rgba(148, 218, 191, 0.08) 0 1px, transparent 1px 18px);
        overflow: hidden;
        border-radius: 18px;
        box-shadow: inset 0 0 28px rgba(101, 230, 226, 0.08);
        animation: lanePulse 1.8s ease-in-out infinite;
    }

    @keyframes lanePulse {
        0%, 100% { opacity: 0.7; box-shadow: inset 0 0 8px rgba(101, 230, 226, 0.08); }
        50% { opacity: 1; box-shadow: inset 0 0 24px rgba(101, 230, 226, 0.18); }
    }

    .pitch-shell .duel-lane {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
        padding: 10px 6px 12px;
        border: 0;
        border-right: 1px solid rgba(154, 225, 197, 0.36);
        background: linear-gradient(180deg, rgba(27, 63, 58, 0.26), rgba(9, 27, 27, 0.16));
        color: #dbeee9;
        cursor: pointer;
        transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .pitch-shell .duel-lane:last-child {
        border-right: 0;
    }

    .pitch-shell .duel-lane.result-goal {
        --lane-result-color: 42, 255, 128;
        animation: lane-result-flash 900ms ease-in-out 1;
    }

    .pitch-shell .duel-lane.result-save {
        --lane-result-color: 255, 70, 78;
        animation: lane-result-flash 900ms ease-in-out 1;
    }

    @keyframes lane-result-flash {
        0%, 100% {
            background: linear-gradient(180deg, rgba(27, 63, 58, 0.26), rgba(9, 27, 27, 0.16));
            box-shadow: inset 0 0 0 rgba(var(--lane-result-color), 0);
        }
        25%, 75% {
            background: rgba(var(--lane-result-color), 0.62);
            box-shadow: inset 0 0 34px rgba(var(--lane-result-color), 0.9), 0 0 22px rgba(var(--lane-result-color), 0.7);
            color: #fff;
        }
        50% {
            background: linear-gradient(180deg, rgba(27, 63, 58, 0.26), rgba(9, 27, 27, 0.16));
            box-shadow: inset 0 0 0 rgba(var(--lane-result-color), 0);
        }
    }

<div class="pitch-shell">
    <div id="scoreline">

            <span id="team-score-a">0</span>
        </span>
        <span>-</span>
        <span id="score-b" class="team-b team-score">

            <span id="flag-b" class="team-flag" aria-hidden="true"></span>
            <span id="team-name-b">Team 2</span>
        </span>
        <span id="match-clock" hidden>0:00</span>
    </div>
    <section id="substitution-panel" hidden aria-label="Substitution controls">

            <button id="substitution-request" class="substitution-button" type="button">Request Substitution</button>
        </div>
        <div id="substitution-requests"></div>
        <p id="substitution-message" aria-live="polite"></p>
    </section>
    <button id="enable-motion" hidden>Enable motion controls</button>

        <canvas id="pitch" width="800" height="500"></canvas>
        <div id="flick" hidden>FLICK!</div>
        <div id="goal-overlay"><span class="goal-text">GOAL!!!</span></div>
        <div id="countdown" hidden></div>
        <div id="powerup-toast"></div>

            <button class="control-mode-button" type="button" data-control-mode="tilt" aria-pressed="true">Tilt</button>
            <button class="control-mode-button" type="button" data-control-mode="joystick" aria-pressed="false">Joystick</button>
            <button class="control-mode-button" type="button" data-control-mode="buttons" aria-pressed="false">Buttons</button>
        </div>
        <div id="joystick-base" hidden aria-label="Movement joystick">
            <span id="joystick-knob"></span>
        </div>

                        <span class="duel-lane-subtitle">STRIKE</span>

                    </button>
                    <button class="duel-lane shootout-direction" type="button" data-direction="right" aria-label="Choose right lane">
                        <span class="duel-lane-symbol" aria-hidden="true">▶</span>
                        <span class="duel-lane-label">RIGHT</span>
                        <span class="duel-lane-subtitle">STRIKE</span>
                        <span id="duel-kicker-marker-right" class="choice-marker">SHOT</span>
                        <span id="duel-keeper-marker-right" class="choice-marker keeper-marker">SAVE</span>

            </div>
            <span id="duel-pulse" aria-hidden="true"></span>

        <div class="shootout-controls">
            <p id="shootout-choice-prompt" aria-live="polite"></p>
            <div id="shootout-goalkeeper-form" class="shootout-row" hidden>

                <button id="shootout-goalkeeper-submit" class="shootout-button" type="button">Set goalkeeper</button>

        </div>

    <div id="gauge">

        <span id="gauge-value">0%</span>

    <div id="confetti"></div>
